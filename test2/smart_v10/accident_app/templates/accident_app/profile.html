{% extends 'accident_app/base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-primary text-white fw-bold"><i class="fas fa-user-edit me-2"></i>My Profile</div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">First Name</label>
                            <input type="text" name="first_name" value="{{ user.first_name }}" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Last Name</label>
                            <input type="text" name="last_name" value="{{ user.last_name }}" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" value="{{ user.email }}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Phone Number</label>
                        {{ form.phone_number }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Address</label>
                        {{ form.address }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Profile Picture</label>
                        {{ form.profile_picture }}
                        {% if profile.profile_picture %}
                        <div class="mt-2"><img src="{{ profile.profile_picture.url }}" class="rounded-circle" width="60" height="60" alt="Profile"></div>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
